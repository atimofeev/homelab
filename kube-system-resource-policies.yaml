# Talos bootstrap manifests do not reconcile existing DaemonSets. Mutate new
# network Pods only; static control-plane Pods use Talos resource configuration.
- apiVersion: admissionregistration.k8s.io/v1
  kind: MutatingAdmissionPolicy
  metadata:
    name: kube-system-network-resources
  spec:
    failurePolicy: Ignore
    reinvocationPolicy: IfNeeded
    matchConstraints:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      objectSelector:
        matchExpressions:
          - key: k8s-app
            operator: In
            values: [flannel, kube-proxy]
      resourceRules:
        - apiGroups: [""]
          apiVersions: [v1]
          operations: [CREATE]
          resources: [pods]
    variables:
      - name: profiles
        expression: >-
          {
            'kube-flannel': {'cpu': '100m', 'memory': '50Mi', 'limit': '256Mi'},
            'kube-network-policies': {'cpu': '100m', 'memory': '50Mi', 'limit': '256Mi'},
            'kube-proxy': {'cpu': '100m', 'memory': '50Mi', 'limit': '256Mi'},
            'install-config': {'cpu': '10m', 'memory': '16Mi', 'limit': '64Mi'}
          }
    mutations:
      - patchType: ApplyConfiguration
        applyConfiguration:
          expression: >-
            Object{
              spec: Object.spec{
                containers: object.spec.containers.filter(c, c.name in variables.profiles).map(c,
                  Object.spec.containers{
                    name: c.name,
                    resources: Object.spec.containers.resources{
                      requests: {'cpu': variables.profiles[c.name]['cpu'], 'memory': variables.profiles[c.name]['memory']},
                      limits: {'memory': variables.profiles[c.name]['limit']}
                    }
                  }),
                initContainers: has(object.spec.initContainers) ?
                  object.spec.initContainers.filter(c, c.name in variables.profiles).map(c,
                    Object.spec.initContainers{
                      name: c.name,
                      resources: Object.spec.initContainers.resources{
                        requests: {'cpu': variables.profiles[c.name]['cpu'], 'memory': variables.profiles[c.name]['memory']},
                        limits: {'memory': variables.profiles[c.name]['limit']}
                      }
                    }) : []
              }
            }
      - patchType: JSONPatch
        jsonPatch:
          expression: >-
            object.spec.containers.filter(c,
              c.name in variables.profiles && has(c.resources) &&
              has(c.resources.limits) && 'cpu' in c.resources.limits).map(c,
                JSONPatch{op: 'remove', path: '/spec/containers/' +
                  string(object.spec.containers.map(c, c.name).indexOf(c.name)) + '/resources/limits/cpu'}) +
            (has(object.spec.initContainers) ? object.spec.initContainers.filter(c,
              c.name in variables.profiles && has(c.resources) &&
              has(c.resources.limits) && 'cpu' in c.resources.limits).map(c,
                JSONPatch{op: 'remove', path: '/spec/initContainers/' +
                  string(object.spec.initContainers.map(c, c.name).indexOf(c.name)) + '/resources/limits/cpu'}) : [])
- apiVersion: admissionregistration.k8s.io/v1
  kind: MutatingAdmissionPolicyBinding
  metadata:
    name: kube-system-network-resources
  spec:
    policyName: kube-system-network-resources
