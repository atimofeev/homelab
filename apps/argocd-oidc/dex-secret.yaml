---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-dex
  namespace: argocd
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: dex-client-secrets
    kind: ClusterSecretStore
  target:
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        client-secret: '{{ .clientSecret }}'
  data:
    - secretKey: clientSecret
      remoteRef:
        key: dex-client-argocd
        property: password
