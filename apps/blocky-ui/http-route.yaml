---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: blocky-ui
  namespace: blocky
  annotations:
    item.homer.rajsingh.info/name: "Blocky UI"
    item.homer.rajsingh.info/subtitle: "Blocky Control & Stats"
    item.homer.rajsingh.info/logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/blocky.webp"
    service.homer.rajsingh.info/name: "System"
    service.homer.rajsingh.info/icon: "fas fa-cogs"

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "blocky-ui.prosto.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: blocky-ui-auth
      backendRefs:
        - group: ""
          kind: Service
          name: blocky-ui
          port: 80
          weight: 1
