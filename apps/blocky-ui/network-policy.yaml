---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: blocky-ui
  namespace: blocky

spec:
  podSelector:
    matchLabels:
      app: blocky-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
