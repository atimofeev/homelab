---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bento-pdf
  namespace: bento-pdf
spec:
  podSelector:
    matchLabels:
      app: bento-pdf
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress: []
