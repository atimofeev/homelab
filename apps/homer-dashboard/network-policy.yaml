---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homer-dashboard
  namespace: homer
spec:
  podSelector:
    matchLabels:
      dashboard.homer.rajsingh.info/name: main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
