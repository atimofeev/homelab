apiVersion: longhorn.io/v1beta2
kind: RecurringJob

metadata:
  name: filesystem-trim
  namespace: longhorn-system

spec:
  name: filesystem-trim
  task: filesystem-trim
  # Longhorn inherits the controller timezone, which is UTC on this Talos cluster.
  cron: "0 3 * * *"
  concurrency: 1
  retain: 0
  groups:
    - default
