---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: longhorn-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"

spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.13.0
      helm:
        releaseName: longhorn
        valuesObject:
          longhornManager:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
          longhornGlobalManager:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          metrics:
            serviceMonitor:
              enabled: true
          preUpgradeChecker:
            jobEnabled: false
          defaultSettings:
            systemManagedCSIComponentsResourceLimits: |
              {
                "csi-attacher": {"requests": {"cpu": "5m", "memory": "32Mi"}, "limits": {"memory": "128Mi"}},
                "csi-provisioner": {"requests": {"cpu": "5m", "memory": "32Mi"}, "limits": {"memory": "128Mi"}},
                "csi-resizer": {"requests": {"cpu": "5m", "memory": "32Mi"}, "limits": {"memory": "128Mi"}},
                "csi-snapshotter": {"requests": {"cpu": "5m", "memory": "32Mi"}, "limits": {"memory": "128Mi"}},
                "longhorn-csi-plugin": {"requests": {"cpu": "10m", "memory": "32Mi"}, "limits": {"memory": "256Mi"}},
                "node-driver-registrar": {"requests": {"cpu": "5m", "memory": "16Mi"}, "limits": {"memory": "64Mi"}},
                "longhorn-liveness-probe": {"requests": {"cpu": "5m", "memory": "16Mi"}, "limits": {"memory": "64Mi"}}
              }
            concurrentAutomaticEngineUpgradePerNodeLimit: "1"
            concurrentReplicaRebuildPerNodeLimit: "2"
            snapshotHeavyTaskConcurrentLimit: "2"
            storageReservedPercentageForDefaultDisk: "10"
          service:
            ui:
              type: ClusterIP
          ingress:
            enabled: false
          httproute:
            enabled: true
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: traefik-gateway
                namespace: traefik
                sectionName: websecure
            hostnames: [longhorn.prosto.dev]
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: longhorn-auth
            annotations:
              item.homer.rajsingh.info/name: "Longhorn"
              item.homer.rajsingh.info/subtitle: "Distributed Storage"
              item.homer.rajsingh.info/logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/longhorn.webp"
              service.homer.rajsingh.info/name: "System"
              service.homer.rajsingh.info/icon: "fas fa-cogs"
    - repoURL: https://github.com/atimofeev/homelab
      targetRevision: HEAD
      path: apps/longhorn-operator
      directory:
        exclude: main.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
