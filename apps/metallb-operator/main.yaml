---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: metallb-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"

spec:
  project: default
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.16.2
    helm:
      releaseName: metallb
      valuesObject:
        controller:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
        speaker:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
        frr-k8s:
          frrk8s:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            frr:
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  memory: 128Mi
            reloader:
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 64Mi
            frrMetrics:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
            frrStatus:
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  memory: 128Mi
            initContainers:
              cpFrrFiles:
                resources:
                  requests:
                    cpu: 5m
                    memory: 16Mi
                  limits:
                    memory: 64Mi
              cpReloader:
                resources:
                  requests:
                    cpu: 5m
                    memory: 16Mi
                  limits:
                    memory: 64Mi
              cpMetrics:
                resources:
                  requests:
                    cpu: 5m
                    memory: 16Mi
                  limits:
                    memory: 64Mi
              cpFrrStatus:
                resources:
                  requests:
                    cpu: 5m
                    memory: 16Mi
                  limits:
                    memory: 64Mi
        prometheus:
          serviceAccount: kube-prometheus-stack-operator
          namespace: monitoring
          serviceMonitor:
            enabled: true
          prometheusRule:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    syncOptions:
      - CreateNamespace=true
