---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"

spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/traefik/helm/traefik
      chart: traefik
      targetRevision: 42.2.0
      helm:
        releaseName: traefik
        valuesObject:
          providers:
            kubernetesGateway:
              enabled: true
          gateway:
            listeners:
              web:
                namespacePolicy:
                  from: All
              websecure:
                port: 8443
                protocol: HTTPS
                namespacePolicy:
                  from: All
                certificateRefs:
                  - name: prosto-dev-wildcard-tls
                    group: ""
                    kind: Secret
    - repoURL: https://github.com/atimofeev/homelab
      targetRevision: HEAD
      path: apps/traefik
      directory:
        exclude: main.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
