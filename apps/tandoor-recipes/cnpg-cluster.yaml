---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: cnpg-tandoor-recipes
  namespace: tandoor-recipes

spec:
  instances: 3
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  maxSyncReplicas: 1
  postgresql:
    parameters:
      max_slot_wal_keep_size: "512MB"
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: recipes
      owner: recipes
