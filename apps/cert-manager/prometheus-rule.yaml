---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: cert-manager

spec:
  groups:
    - name: cert-manager
      rules:
        - alert: CertManagerCertificateRenewalOverdue
          expr: |
            certmanager_certificate_renewal_timestamp_seconds < time()
            and
            certmanager_certificate_expiration_timestamp_seconds > time()
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} renewal is overdue"
        - alert: CertManagerCertificateExpiringCritical
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 43200
            and
            certmanager_certificate_expiration_timestamp_seconds - time() > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in less than 12 hours"
        - alert: CertManagerCertificateExpired
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} has expired"
        - alert: CertManagerCertificateNotReady
          expr: |
            certmanager_certificate_ready_status{condition="True"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready"
