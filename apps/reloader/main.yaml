---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"

spec:
  project: default
  sources:
    - repoURL: https://stakater.github.io/stakater-charts
      chart: reloader
      targetRevision: 2.2.18
      helm:
        releaseName: reloader
        valuesObject:
          reloader:
            reloadOnCreate: true
            syncAfterRestart: true
    - repoURL: https://github.com/atimofeev/homelab
      targetRevision: HEAD
      path: apps/reloader
      directory:
        exclude: main.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
