---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: cnpg-paperless
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: database

spec:
  instances: 3
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  maxSyncReplicas: 1

  postgresql:
    parameters:
      wal_keep_size: "128MB"
      max_wal_size: "512MB"
      max_slot_wal_keep_size: "2GB"
      # Restore a bounded timeout when configuring WAL archive backups.
      archive_timeout: "0"

  bootstrap:
    initdb:
      database: paperless
      owner: paperless

  storage:
    size: 2Gi

  walStorage:
    size: 3Gi
