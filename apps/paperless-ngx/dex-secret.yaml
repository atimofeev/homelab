---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-dex
  namespace: paperless-ngx
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: dex-client-secrets
    kind: ClusterSecretStore
  target:
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
          {
            "openid_connect": {
              "APPS": [{
                "provider_id": "dex",
                "name": "Google",
                "client_id": "paperless",
                "secret": {{ .clientSecret | toJson }},
                "settings": {
                  "server_url": "https://dex.prosto.dev/.well-known/openid-configuration",
                  "token_auth_method": "client_secret_basic"
                }
              }]
            }
          }
  data:
    - secretKey: clientSecret
      remoteRef:
        key: dex-client-paperless
        property: password
