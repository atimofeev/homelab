---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: paperless-ngx
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    item.homer.rajsingh.info/name: "Paperless-ngx"
    item.homer.rajsingh.info/subtitle: "Document Management"
    item.homer.rajsingh.info/logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/paperless-ngx.webp"
    service.homer.rajsingh.info/name: "Tools"
    service.homer.rajsingh.info/icon: "fas fa-screwdriver-wrench"
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: server

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - paperless.prosto.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: paperless-ngx
          port: 8000
          weight: 1
      timeouts:
        request: 300s
