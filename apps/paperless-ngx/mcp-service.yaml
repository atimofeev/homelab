kind: Service

metadata:
  name: paperless-mcp
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: paperless-mcp
    app.kubernetes.io/component: mcp

spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paperless-mcp
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
