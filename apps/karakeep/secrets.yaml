---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: karakeep-password
  namespace: karakeep
spec:
  length: 64
  digits: 16
  symbols: 0
  allowRepeat: true
  encoding: base64url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-auth
  namespace: karakeep
spec:
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Orphan
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: karakeep-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-meilisearch
  namespace: karakeep
spec:
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Orphan
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: karakeep-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-dex
  namespace: karakeep
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: dex-client-secrets
    kind: ClusterSecretStore
  target:
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        OAUTH_CLIENT_SECRET: '{{ .clientSecret }}'
  data:
    - secretKey: clientSecret
      remoteRef:
        key: dex-client-karakeep
        property: password
