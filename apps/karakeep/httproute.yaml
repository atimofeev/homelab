---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: karakeep
  namespace: karakeep
  annotations:
    item.homer.rajsingh.info/name: Karakeep
    item.homer.rajsingh.info/subtitle: Bookmarks and Read Later
    item.homer.rajsingh.info/logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/karakeep.webp
    service.homer.rajsingh.info/name: Apps
    service.homer.rajsingh.info/icon: fas fa-screwdriver-wrench
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - karakeep.prosto.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: karakeep
          port: 3000
