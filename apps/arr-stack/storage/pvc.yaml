---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: arr-media
  namespace: arr-stack
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false

spec:
  accessModes:
    - ReadWriteMany
  storageClassName: single-replica
  resources:
    requests:
      storage: 250Gi
