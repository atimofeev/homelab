---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: media-volume
  namespace: arr-stack
  labels:
    app.kubernetes.io/part-of: arr-stack

spec:
  groups:
    - name: arr-stack
      rules:
        - alert: MediaVolumeUsageWarning
          expr: |
            kubelet_volume_stats_used_bytes{namespace="arr-stack", persistentvolumeclaim="arr-media"}
            /
            clamp_min(kubelet_volume_stats_capacity_bytes{namespace="arr-stack", persistentvolumeclaim="arr-media"}, 1) > 0.80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Media volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} above 80% usage"
        - alert: MediaVolumeUsageCritical
          expr: |
            kubelet_volume_stats_used_bytes{namespace="arr-stack", persistentvolumeclaim="arr-media"}
            /
            clamp_min(kubelet_volume_stats_capacity_bytes{namespace="arr-stack", persistentvolumeclaim="arr-media"}, 1) > 0.90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Media volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} above 90% usage"
