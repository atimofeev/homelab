---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vert
  namespace: vert
spec:
  podSelector:
    matchLabels:
      app: vert
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 80
  egress: []
