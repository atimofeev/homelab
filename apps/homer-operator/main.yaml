---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: homer-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"

spec:
  project: default
  source:
    repoURL: oci://ghcr.io/rajsinghtech/homer-operator/charts/homer-operator
    chart: homer-operator
    targetRevision: 1.2.4
    helm:
      releaseName: homer-operator
      valuesObject:
        operator:
          enableGatewayAPI: true
        prometheusRule:
          enabled: true
        grafanaDashboard:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: homer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
