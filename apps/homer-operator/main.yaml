---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: homer-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"

spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/rajsinghtech/homer-operator/charts/homer-operator
      chart: homer-operator
      targetRevision: 1.2.4
      helm:
        releaseName: homer-operator
        valuesObject:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: null
              memory: 128Mi
          highAvailability:
            podDisruptionBudget:
              # Permit maintenance drains of the single operator replica.
              maxUnavailable: 1
          operator:
            enableGatewayAPI: true
          prometheusRule:
            enabled: true
          grafanaDashboard:
            enabled: true
    - repoURL: https://github.com/atimofeev/homelab
      targetRevision: HEAD
      path: apps/homer-operator
      directory:
        exclude: main.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
