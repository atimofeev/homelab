---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homer-operator
  namespace: homer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homer-operator
      app.kubernetes.io/instance: homer-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 8443
