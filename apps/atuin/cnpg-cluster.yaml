---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: cnpg-atuin
  namespace: atuin

spec:
  instances: 3
  maxSyncReplicas: 1
  storage:
    storageClass: single-replica
    size: 5Gi
  walStorage:
    storageClass: single-replica
    size: 3Gi
  postgresql:
    parameters:
      wal_keep_size: "128MB"
      max_wal_size: "512MB"
  bootstrap:
    initdb:
      database: atuin
      owner: atuin
