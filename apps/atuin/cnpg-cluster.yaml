---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: cnpg-atuin
  namespace: atuin

spec:
  instances: 3
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  maxSyncReplicas: 1
  storage:
    storageClass: single-replica
    size: 5Gi
  walStorage:
    storageClass: single-replica
    size: 3Gi
  postgresql:
    parameters:
      wal_keep_size: "128MB"
      max_wal_size: "512MB"
      max_slot_wal_keep_size: "2GB"
      # Restore a bounded timeout when configuring WAL archive backups.
      archive_timeout: "0"
  bootstrap:
    initdb:
      database: atuin
      owner: atuin
