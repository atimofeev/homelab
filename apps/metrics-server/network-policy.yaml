---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-server
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
      app.kubernetes.io/instance: metrics-server
  policyTypes:
    - Ingress
  ingress:
    # Aggregation and metrics share this listener; keep it reachable by host-network API servers.
    - ports:
        - protocol: TCP
          port: 10250
