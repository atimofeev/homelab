apiVersion: monitoring.coreos.com/v1
kind: PodMonitor

metadata:
  name: cnpg-clusters
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cnpg

spec:
  selector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  namespaceSelector:
    any: true
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster
