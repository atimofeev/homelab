---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-dex
  namespace: monitoring
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: dex-client-secrets
    kind: ClusterSecretStore
  target:
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: '{{ .clientSecret }}'
  data:
    - secretKey: clientSecret
      remoteRef:
        key: dex-client-grafana
        property: password
