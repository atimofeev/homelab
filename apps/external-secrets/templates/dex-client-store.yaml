---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex-client-secret-reader
  namespace: dex
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dex-client-secret-reader
  namespace: dex
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- range .Values.externalSecrets.dexClients }}
      - dex-client-{{ .name }}
      {{- end }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dex-client-secret-reader
  namespace: dex
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dex-client-secret-reader
subjects:
  - kind: ServiceAccount
    name: dex-client-secret-reader
    namespace: dex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dex-client-token-request
  namespace: dex
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [dex-client-secret-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dex-client-token-request
  namespace: dex
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dex-client-token-request
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: dex-client-secrets
spec:
  conditions:
    - namespaces:
        {{- range .Values.externalSecrets.dexClients }}
        - {{ .namespace }}
        {{- end }}
  provider:
    kubernetes:
      remoteNamespace: dex
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: dex
          key: ca.crt
      auth:
        serviceAccount:
          name: dex-client-secret-reader
          namespace: dex
