---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dex-client-secret
  namespace: dex
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 48
  digits: 16
  symbols: 0
  allowRepeat: true
  encoding: base64url
{{- range .Values.externalSecrets.dexClients }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-client-{{ .name }}
  namespace: dex
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Orphan
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: dex-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}-dex
  namespace: {{ .namespace }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: dex-client-secrets
    kind: ClusterSecretStore
  target:
    {{- toYaml .target | nindent 4 }}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: dex-client-{{ .name }}
        property: password
{{- end }}
