---
externalSecrets:
  storeName: bitwarden-secrets-manager
  refreshInterval: 1h0m0s
  secrets:
    - name: cloudflare-dns-rw
      namespace: cert-manager
      bitwardenKey: "a39916d1-750d-492f-b158-b41101576a1c"
    - name: mikrotik-dns-rw
      namespace: external-dns
      bitwardenKey: "5a36f7a5-4e90-4bcd-b7b0-b411015a4f8f"
    - name: grafana-admin
      namespace: monitoring
      bitwardenKey: "fab4989d-41bf-4eec-8bab-b411015ad92e"
    - name: alertmanager-telegram
      namespace: monitoring
      bitwardenKey: "e4e6225d-47c7-47ca-af32-b4bf005c4479"
    - name: dex-credentials
      namespace: dex
      bitwardenKey: "3c031c83-6f12-4b8c-b603-b4ec0174cee8"
    - name: argocd-dex
      namespace: argocd
      bitwardenKey: "3c031c83-6f12-4b8c-b603-b4ec0174cee8"
      target:
        template:
          engineVersion: v2
          mergePolicy: Replace
          metadata:
            labels:
              app.kubernetes.io/part-of: argocd
          data:
            client-secret: '{{ .ARGOCD_CLIENT_SECRET }}'
    - name: grafana-dex
      namespace: monitoring
      bitwardenKey: "3c031c83-6f12-4b8c-b603-b4ec0174cee8"
      target:
        template:
          engineVersion: v2
          mergePolicy: Replace
          data:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: '{{ .GRAFANA_CLIENT_SECRET }}'
