---
externalSecrets:
  storeName: bitwarden-secrets-manager
  refreshInterval: 1h0m0s
  secrets:
    - name: cloudflare-dns-rw
      namespace: cert-manager
      bitwardenKey: "a39916d1-750d-492f-b158-b41101576a1c"
    - name: mikrotik-dns-rw
      namespace: external-dns
      bitwardenKey: "5a36f7a5-4e90-4bcd-b7b0-b411015a4f8f"
    - name: alertmanager-telegram
      namespace: monitoring
      bitwardenKey: "e4e6225d-47c7-47ca-af32-b4bf005c4479"
    - name: dex-credentials
      namespace: dex
      bitwardenKey: "3c031c83-6f12-4b8c-b603-b4ec0174cee8"
      target:
        template:
          engineVersion: v2
          mergePolicy: Replace
          data:
            GOOGLE_CLIENT_ID: '{{ .GOOGLE_CLIENT_ID }}'
            GOOGLE_CLIENT_SECRET: '{{ .GOOGLE_CLIENT_SECRET }}'
  dexClients:
    - name: argocd
      namespace: argocd
      target:
        template:
          engineVersion: v2
          mergePolicy: Replace
          metadata:
            labels:
              app.kubernetes.io/part-of: argocd
          data:
            client-secret: '{{ .clientSecret }}'
    - name: grafana
      namespace: monitoring
      target:
        template:
          engineVersion: v2
          mergePolicy: Replace
          data:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: '{{ .clientSecret }}'
    - name: paperless
      namespace: paperless-ngx
      target:
        template:
          engineVersion: v2
          mergePolicy: Replace
          data:
            PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
              {
                "openid_connect": {
                  "APPS": [{
                    "provider_id": "dex",
                    "name": "Google",
                    "client_id": "paperless",
                    "secret": {{ .clientSecret | toJson }},
                    "settings": {
                      "server_url": "https://dex.prosto.dev/.well-known/openid-configuration",
                      "token_auth_method": "client_secret_basic"
                    }
                  }]
                }
              }
